url: https://stratigraphy.github.io/WaverideR/

template:
  bootstrap: 5
  bslib:
    primary: "#1f4e79"

home:
  title: "WaverideR: wavelet and superlet analysis for cyclostratigraphy in R"
  description: >
    Extracts and analyses cyclic signals in stratigraphic and other time series with the continuous wavelet
    transform, superlets and synchrosqueezed transforms: spectra, significance tests, sedimentation-rate
    estimation, tracking of astronomical cycles, age models with uncertainty and astrochronological testing.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]

